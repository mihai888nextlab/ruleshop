server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: deep links fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /config.js {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
